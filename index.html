<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Idiom Flashcards</title>
  <style>
  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background: #f0f2f5; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    height: 100vh; 
    margin: 0; 
    padding: 16px;
    box-sizing: border-box;
    overflow: hidden; /* Prevents scrollbars */
  }
  
  .card-container { 
    perspective: 1000px; 
    width: min(800px, 120vw); 
    height: min(610px, 90vh); /* Scales card height to fit screen */
    cursor: pointer; 
  }
  
  .card { 
    width: 100%; 
    height: 100%; 
    position: relative; 
    transform-style: preserve-3d; 
    transition: transform 0.6s ease-in-out; 
    box-shadow: 0 12px 30px rgba(0,0,0,0.12); 
    border-radius: 20px; 
  }
  
  .card.flipped { 
    transform: rotateY(180deg); 
  }
  
  .card-face { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    backface-visibility: hidden; 
    border-radius: 20px; 
    background: white; 
    box-sizing: border-box; 
    padding: 14px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: space-between; 
    text-align: center; 
    border: 1px solid #e2e8f0;
    overflow: hidden;
  }
  
  .card-back { 
    transform: rotateY(180deg); 
    background: #f8fafc; 
  }
  
  h2 { 
    margin: 0; 
    color: #0f172a; 
    font-size: clamp(1.2rem, 3vh, 1.8rem);
  }
  
  #front-media, #back-media {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0; /* Allows image container to shrink */
    margin-top: 8px;
  }

  img { 
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
    border-radius: 12px; 
  }
  
  .placeholder { 
    width: 100%; 
    height: 100%; 
    background: #e2e8f0; 
    border: 2px dashed #cbd5e1; 
    border-radius: 12px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: #475569; 
    font-size: 0.95rem; 
    padding: 12px; 
    box-sizing: border-box; 
    line-height: 1.4;
  }
  
  .controls { 
    margin-top: 16px; 
    display: flex; 
    gap: 16px; 
    align-items: center; 
  }
  
  button { 
    padding: 10px 20px; 
    font-size: 0.95rem; 
    border: none; 
    background: #2563eb; 
    color: white; 
    border-radius: 10px; 
    cursor: pointer; 
    font-weight: 600; 
    transition: background 0.2s;
  }
  
  button:hover { 
    background: #1d4ed8; 
  }
  
  .hint { 
    margin-top: 8px; 
    font-size: 0.85rem; 
    color: #64748b; 
  }
</style>
</head>
<body>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <h2 id="front-title"></h2>
        <div id="front-media"></div>
      </div>
      <div class="card-face card-back">
        <h2 id="back-title"></h2>
        <p id="back-def" style="margin: 6px 0; font-size: 1.1rem; font-weight: 500; color: #1e293b;"></p>
        <p id="back-example" style="font-style: italic; color: #64748b; font-size: 0.95rem; margin-bottom: 12px;"></p>
        <div id="back-media"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevCard(event)">Previous</button>
    <span id="counter" style="font-weight: 600; color: #334155; font-size: 1.1rem;">1 / 25</span>
    <button onclick="nextCard(event)">Next</button>
  </div>
  <div class="hint">Click the card to flip!</div>

    let currentIndex = 0;

    function renderCard() {
      const c = cards[currentIndex];
      document.getElementById('card').classList.remove('flipped');
      document.getElementById('front-title').innerText = c.idiom;
      document.getElementById('back-title').innerText = c.idiom;
      document.getElementById('back-def').innerText = c.def;
      document.getElementById('back-example').innerText = c.example;
      document.getElementById('counter').innerText = `${currentIndex + 1} / ${cards.length}`;

      const frontMedia = document.getElementById('front-media');
      if (c.frontImg) {
        frontMedia.innerHTML = `<img src="${c.frontImg}" alt="${c.idiom}">`;
      } else {
        frontMedia.innerHTML = `<div class="placeholder">${c.frontDesc}</div>`;
      }

      const backMedia = document.getElementById('back-media');
      if (c.backImg) {
        backMedia.innerHTML = `<img src="${c.backImg}" alt="${c.idiom}">`;
      } else {
        backMedia.innerHTML = `<div class="placeholder">${c.backDesc}</div>`;
      }
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextCard(e) {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }

    function prevCard(e) {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      renderCard();
    }

    renderCard();
  </script>
</body>
</html>
